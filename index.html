<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./tabStyle.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="Aluno.js" defer></script>
    <script src="Turma.js" defer></script>
    <script src="Interface.js" defer></script>
    <script src="main.js" defer></script>
    <title>Sistema Escolar</title>
  </head>
  <body>
    <!-- Botões para trocar de aba -->
    <div class="tabs-container">
      <button class="tab-button active" id="btn-cadastrar-turma" onclick="Interface.cadastrarTurma()">Cadastrar Turma</button>
      <button class="tab-button" id="btn-cadastrar" onclick="Interface.cadastrar()">Cadastrar Aluno</button>
      <button class="tab-button" id="btn-listar" onclick="listarAluno()">
        Listar Alunos
      </button>
    </div>
     <!-- Conteúdo da Aba 1: Cadastrar Turma-->
     <div id="tab-cadastrar-turma" class="tab-content active">
      Curso: <input id="curso" type="text" /> 
      Professor: <input id="prof" type="text" /> 
      <button onclick="btnSalvarTurma()" class="btn-salvar">Salvar Turma</button>
    </div>

    <!-- Conteúdo da Aba 2: Cadastrar -->
    <div id="tab-cadastrar" class="tab-content">
      Nome: <input id="nome" type="text" /> Nota 1:
      <input id="n1" type="text" /> Nota 2: <input id="n2" type="text" /> Nota
      3: <input id="n3" type="text" />
      <button onclick="btnSalvar()" class="btn-salvar">Salvar Aluno</button>
    </div>

    <!-- Conteúdo da Aba 3: Listar -->
    <div id="tab-listar" class="tab-content">
      <h3>Alunos Cadastrados</h3>
      <ul class="lista-alunos" id="alunos">
        <!-- O JavaScript vai colocar os alunos aqui depois -->
        <li>Nenhum aluno cadastrado ainda.</li>
      </ul>
    </div>
  </body>
</html>
